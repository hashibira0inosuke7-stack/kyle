name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pyinstaller pillow pygetwindow keyboard

    - name: Build exe
      run: pyinstaller --onefile --noconsole main.py

    - name: Upload exe
      uses: actions/upload-artifact@v3
      with:
        name: caine-app
        path: dist/main.exe
